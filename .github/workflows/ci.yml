# ci.yml: this repository's own checks. `tests` runs the pr-checks test
# suite; `pr-checks` runs the reusable workflow from this branch, so a
# change to the rules is checked by the rules it proposes.
name: ci

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

# pull-requests: write is for pr-checks' protected-path label; a reusable
# workflow gets no more than its caller grants.
permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/pr-checks.test.sh

  pr-checks:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-checks.yml
