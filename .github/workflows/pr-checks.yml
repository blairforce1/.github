# pr-checks.yml: a reusable workflow that checks a pull request's title and
# body against the PAP rules a reviewer should not have to remember. A
# repository adopts it with a caller workflow; see README.md.
#
# It refuses:
#   - a title that is not a conventional commit, type(scope): description,
#     with a type from the list below (rule 1.2 of blairforce1/pap);
#   - a process: title whose body has no Record: NNNN line (rule 1.2);
#   - a Checks box left unticked with no reason on the line below it;
#   - a ticked provenance box with nothing recorded: no Co-authored-by
#     trailer on any commit and no Provenance: line in the body;
#   - an unticked provenance box on a pull request that shows generated
#     content: a commit co-authored by noreply@anthropic.com, or a
#     "Generated with" line in the body;
#   - a body with no Change: line, or one naming an id for which the pull
#     request's head has no changes/<id>/ folder (Change: none is always
#     accepted);
#   - anything but exactly one class:* label;
#   - a pull request touching a protected path whose body has no
#     `Approved-by: @login` line naming an owner of every protected file,
#     whether its protected-path box is ticked or not: a reason under the
#     box does not stand in for an approval (decision 0012 of
#     blairforce1/pap). Bots are not exempt.
# It also keeps the protected-path label true: when the base branch has a
# .github/CODEOWNERS, a pull request whose changed files (and the old names
# of renamed ones) have an owner in it gets the label, and loses it on a
# later push that no longer does. As in CODEOWNERS, the last matching line
# decides a file's owners. The base branch's file is used, as
# GitHub does, so a pull request cannot unprotect itself. Patterns are
# matched by `git check-ignore`, since CODEOWNERS uses gitignore syntax.
# Change footer, class label and protected paths each report as their own
# annotation, pass or fail.
# It cannot find generated content nobody declared, or tell who typed an
# Approved-by line. It makes an omission visible, not a false declaration.
#
# A pull request opened by a bot account (a login ending in [bot], such as
# renovate[bot]) skips the Checks section and the provenance checks, which
# ask about a template the bot does not fill. Its title, Change line and
# class label are still checked, so the bot's configuration must supply
# them: for Renovate, semanticCommits, labels and prBodyNotes. A bot pull
# request that touches a protected path waits for an owner's Approved-by
# line like any other.
# The script is inline so that a caller's @ref pins the rules and the code
# together; tests/pr-checks.test.sh extracts and runs it. It reads only
# files and environment; the step before it does every API call.
#
# pull-requests: write is for the protected-path label and nothing else. A
# caller must grant it, and should trigger on labeled and unlabeled so a
# class label added after opening re-runs the check. On a pull request from
# a fork the token stays read-only and the label step warns instead.

name: pr-checks

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - name: Fetch commits, files, change folders and CODEOWNERS
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # get <path> <out>: a 404 is an absent file, anything else fails.
          get() {
            if gh api "$@" 2> "$RUNNER_TEMP/err"; then return 0; fi
            grep -q 'HTTP 404' "$RUNNER_TEMP/err" && return 1
            cat "$RUNNER_TEMP/err" >&2; exit 1
          }
          gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/commits" \
            | jq '[.[][] | .commit.message]' > "$RUNNER_TEMP/commits.json"
          # Labels live, not from the event: `gh pr create --label` fires
          # opened before the label lands, and that run would race the
          # labeled one for the check's final status.
          gh api --paginate --slurp "repos/$REPO/issues/$NUMBER/labels" \
            | jq '[.[][] | .name]' > "$RUNNER_TEMP/labels.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/files" \
            | jq -r '.[][] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          if get "repos/$HEAD_REPO/contents/changes?ref=$HEAD_SHA" > "$RUNNER_TEMP/changes.json"; then
            jq -r '.[] | select(.type == "dir") | .name' "$RUNNER_TEMP/changes.json" > "$RUNNER_TEMP/changes.txt"
          else
            : > "$RUNNER_TEMP/changes.txt"
          fi
          if ! get -H 'Accept: application/vnd.github.raw' \
              "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE_SHA" > "$RUNNER_TEMP/CODEOWNERS"; then
            rm -f "$RUNNER_TEMP/CODEOWNERS"
          fi
          echo "commits: $(jq length "$RUNNER_TEMP/commits.json"), labels: $(jq -c . "$RUNNER_TEMP/labels.json"), files: $(wc -l < "$RUNNER_TEMP/files.txt"), change folders: $(wc -l < "$RUNNER_TEMP/changes.txt"), CODEOWNERS on base: $([ -f "$RUNNER_TEMP/CODEOWNERS" ] && echo yes || echo no)"

      - name: Check title and body
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS_FILE: ${{ runner.temp }}/labels.json
          COMMITS_FILE: ${{ runner.temp }}/commits.json
          FILES_FILE: ${{ runner.temp }}/files.txt
          CHANGES_FILE: ${{ runner.temp }}/changes.txt
          CODEOWNERS_FILE: ${{ runner.temp }}/CODEOWNERS
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          # fail <message> [title]; note <message> <title>. A title makes the
          # annotation its own line in the run summary.
          fail() { printf '::error%s::%s\n' "${2:+ title=$2}" "$1"; failed=1; }
          note() { printf '::notice title=%s::%s\n' "$2" "$1"; }

          bot=0
          case "${PR_AUTHOR:-}" in *'[bot]') bot=1 ;; esac

          # Web edits store the body with CRLF line endings.
          body="$(printf '%s' "${PR_BODY:-}" | tr -d '\r')"
          title="${PR_TITLE:-}"

          # Title: type(scope): description
          types='feat|fix|docs|style|refactor|perf|test|build|ci|cli|chore|revert|process'
          if ! printf '%s\n' "$title" | grep -Eq "^($types)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^ ]"; then
            fail "Title is not a conventional commit: '$title'. Expected type(scope): description, type one of ${types//|/, }."
          fi

          # Rule 1.2: a process change names its decision record.
          if printf '%s\n' "$title" | grep -Eq '^process(\(|!|:)'; then
            if ! printf '%s\n' "$body" | grep -Eq '^Record: *[0-9]{4}[[:space:]]*$'; then
              fail "A process: pull request needs a 'Record: NNNN' line naming its decision record."
            fi
          fi

          # Checks section: from '## Checks' to the next '## ' heading, with
          # HTML comments removed.
          if [ "$bot" = 1 ]; then
            note "Opened by $PR_AUTHOR: the Checks section and provenance are not checked." "Checks section"
          else
            checks="$(printf '%s\n' "$body" \
              | perl -0pe 's/<!--.*?-->//gs' \
              | awk '/^## /{inside = ($0 ~ /^## Checks[[:space:]]*$/); next} inside')"
            if [ -z "$(printf '%s' "$checks" | tr -d '[:space:]')" ]; then
              fail "No '## Checks' section. Start the body from the pull request template."
            else
              # An unticked box needs a reason on the very next line.
              unexplained="$(printf '%s\n' "$checks" | awk '
                function isbox(s) { return s ~ /^[[:space:]]*[-*] \[[ xX]\] / }
                pending != "" {
                  if ($0 ~ /^[[:space:]]*$/ || isbox($0)) print pending
                  pending = ""
                }
                /^[[:space:]]*[-*] \[ \] / { pending = $0; sub(/^[[:space:]]*[-*] \[ \] /, "", pending) }
                END { if (pending != "") print pending }')"
              while IFS= read -r box; do
                [ -n "$box" ] && fail "Unticked with no reason on the next line: '$box'."
              done <<< "$unexplained"

              prov="$(printf '%s\n' "$checks" | grep -E '^[[:space:]]*[-*] \[[ xX]\] Generated content carries provenance' || true)"
              if [ -z "$prov" ]; then
                fail "The Checks section has no 'Generated content carries provenance' box."
              else
                ticked=0
                printf '%s\n' "$prov" | grep -Eq '\[[xX]\]' && ticked=1
                recorded=0
                jq -r '.[]' "$COMMITS_FILE" | tr -d '\r' | grep -Eiq '^co-authored-by: ' && recorded=1
                printf '%s\n' "$body" | grep -Eq '^Provenance: ' && recorded=1
                generated=0
                jq -r '.[]' "$COMMITS_FILE" | tr -d '\r' | grep -Eiq '^co-authored-by: .*noreply@anthropic\.com' && generated=1
                printf '%s\n' "$body" | grep -Eq 'Generated with ' && generated=1
                if [ "$ticked" = 1 ] && [ "$recorded" = 0 ]; then
                  fail "Provenance is ticked but not recorded: no commit has a Co-authored-by trailer and the body has no 'Provenance:' line."
                fi
                if [ "$ticked" = 0 ] && [ "$generated" = 1 ]; then
                  fail "Generated content is present (an Anthropic co-author trailer or a 'Generated with' line) but the provenance box is unticked."
                fi
              fi
            fi
          fi

          # Change footer: none, or an id with a changes/<id>/ folder in the
          # head. HTML comments are removed first, as for Checks.
          t='Change footer'
          uncommented="$(printf '%s\n' "$body" | perl -0pe 's/<!--.*?-->//gs')"
          if ! printf '%s\n' "$uncommented" | grep -Eq '^Change:'; then
            fail "No 'Change:' line. Add 'Change: none', or 'Change: <id>' naming the changes/<id>/ folder this pull request belongs to." "$t"
          else
            change="$(printf '%s\n' "$uncommented" | sed -n 's/^Change:[[:space:]]*//p' | head -n 1 | sed 's/[[:space:]]*$//')"
            if [ "$change" = none ]; then
              note "Change: none" "$t"
            elif ! printf '%s\n' "$change" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              fail "'Change: $change' is not 'none' or a change id (letters, digits, . _ -)." "$t"
            elif grep -Fxq -- "$change" "$CHANGES_FILE"; then
              note "Change: $change, and changes/$change/ exists" "$t"
            else
              fail "'Change: $change' names no changes/$change/ folder in the pull request's head. Add the folder, or use 'Change: none'." "$t"
            fi
          fi

          # Class label: exactly one class:* label.
          t='Class label'
          classes="$(jq -r '.[] | select(startswith("class:"))' "$LABELS_FILE")"
          count="$(printf '%s' "$classes" | grep -c . || true)"
          if [ "$count" = 1 ]; then
            note "$classes" "$t"
          elif [ "$count" = 0 ]; then
            fail "No class:* label. Add exactly one, such as class:feature or class:chore." "$t"
          else
            fail "$count class:* labels: $(printf '%s' "$classes" | paste -sd, - | sed 's/,/, /g'). Keep exactly one." "$t"
          fi

          # Protected paths: decided here, labelled by the next step.
          t='Protected paths'
          protected=''
          if [ -f "$CODEOWNERS_FILE" ]; then
            match="$(mktemp -d)"
            git init -q "$match"
            # One pattern at a time, so a file's owners come from the last
            # line that matches it, as in CODEOWNERS; with every pattern at
            # once, check-ignore names the pattern that excluded a parent
            # directory instead. A last line with no owners unowns the file.
            rc=0 n=0
            : > "$match/hits"
            while IFS= read -r line || [ -n "$line" ]; do
              n=$((n + 1))
              pattern="$(printf '%s\n' "$line" | awk '$1 !~ /^#/ { print $1 }')"
              [ -n "$pattern" ] || continue
              printf '%s\n' "$pattern" > "$match/patterns"
              git -C "$match" -c core.excludesFile="$match/patterns" check-ignore --no-index --stdin < "$FILES_FILE" \
                | sed "s/\$/\t$n/" >> "$match/hits" || { rc=$?; [ "$rc" = 1 ] || break; rc=0; }
            done < "$CODEOWNERS_FILE"
            if [ "$rc" != 0 ]; then
              fail "Could not match the changed files against .github/CODEOWNERS (git check-ignore exit $rc)." "$t"
            else
              # file<TAB>owners, for each changed file with an owner.
              owned="$(awk -F'\t' -v co="$CODEOWNERS_FILE" '
                BEGIN { while ((getline l < co) > 0) { n++; sub(/[[:space:]]#.*$/, "", l)
                  sub(/^[[:space:]]*[^[:space:]]+[[:space:]]*/, "", l); sub(/[[:space:]]+$/, "", l); owners[n] = l } }
                { if (!($1 in last)) order[++k] = $1; last[$1] = $2 }
                END { for (i = 1; i <= k; i++) { o = owners[last[order[i]]]; if (o != "") print order[i] "\t" o } }' "$match/hits")"
              if [ -z "$owned" ]; then
                protected=false
                note "No changed file matches .github/CODEOWNERS." "$t"
              else
                protected=true
                # Decision 0012 in blairforce1/pap: an owner of every
                # protected file approves it in the body, whatever the box
                # says. A reason under the box does not stand in for it.
                files="$(printf '%s\n' "$owned" | cut -f1 | paste -sd, - | sed 's/,/, /g')"
                login='@[A-Za-z0-9][A-Za-z0-9-]*(/[A-Za-z0-9_.-]+)?'
                approvers="$(printf '%s\n' "$uncommented" \
                  | grep -E "^[[:space:]]*Approved-by: *$login( *, *$login)*[[:space:]]*$" \
                  | grep -oE "$login" | tr '[:upper:]' '[:lower:]' | sort -u | paste -sd, - || true)"
                if [ -z "$approvers" ]; then
                  fail "Touches protected paths ($files) but the body has no 'Approved-by: @login' line. An owner from .github/CODEOWNERS ($(printf '%s\n' "$owned" | cut -f2 | tr ' ' '\n' | grep . | sort -u | paste -sd, - | sed 's/,/, /g')) writes it before merge; a reason under the box does not stand in for it." "$t"
                else
                  unapproved="$(printf '%s\n' "$owned" | awk -F'\t' -v ok="$approvers" '
                    BEGIN { n = split(ok, a, ","); for (i = 1; i <= n; i++) set[a[i]] = 1 }
                    { m = split(tolower($2), o, /[[:space:]]+/); hit = 0
                      for (i = 1; i <= m; i++) if (o[i] in set) hit = 1
                      if (!hit) print $1 "\t" $2 }')"
                  if [ -n "$unapproved" ]; then
                    while IFS=$'\t' read -r file owners; do
                      fail "'Approved-by: ${approvers//,/, }' names no owner of $file (owners: ${owners// /, })." "$t"
                    done <<< "$unapproved"
                  else
                    note "Touches protected paths: $files. Approved-by: ${approvers//,/, }, an owner of each." "$t"
                  fi
                fi
              fi
            fi
          else
            note "No .github/CODEOWNERS on the base branch; the protected-path label is left as it is." "$t"
          fi
          printf 'protected=%s\n' "$protected" >> "${GITHUB_OUTPUT:-/dev/null}"

          if [ "$failed" = 0 ]; then echo "pr-checks: title and body pass"; fi
          exit "$failed"

      - name: Apply or remove the protected-path label
        if: always() && steps.check.outputs.protected != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PROTECTED: ${{ steps.check.outputs.protected }}
          LABELS_FILE: ${{ runner.temp }}/labels.json
        shell: bash
        run: |
          set -euo pipefail
          has="$(jq 'index("protected-path") != null' "$LABELS_FILE")"
          if [ "$PROTECTED" = true ] && [ "$has" = false ]; then
            gh api -X POST "repos/$REPO/issues/$NUMBER/labels" -f 'labels[]=protected-path' > /dev/null \
              || echo "::warning title=Protected paths::Could not add the protected-path label; the token may be read-only (a fork)."
          elif [ "$PROTECTED" = false ] && [ "$has" = true ]; then
            gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/protected-path" > /dev/null \
              || echo "::warning title=Protected paths::Could not remove the protected-path label; the token may be read-only (a fork)."
          fi
          echo "protected=$PROTECTED, label was present: $has"
